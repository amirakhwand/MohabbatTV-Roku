name: Sync YouTube channel

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r sync/requirements.txt
      - name: Rebuild app data if the channel changed
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python sync/sync.py --out docs
      - name: Publish changes
        run: |
          git add docs
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "channel-sync"
          git config user.email "channel-sync@users.noreply.github.com"
          git commit -m "Update channel data"
          git push
